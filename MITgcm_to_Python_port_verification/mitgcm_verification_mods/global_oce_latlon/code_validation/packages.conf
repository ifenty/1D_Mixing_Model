#-- list of packages (or group of packages) to compile for this experiment:
#-- Forward-only KPP variant: code_oad's package list with openad/adjoint
#-- stripped. code_oad is the only global_oce_latlon code/ variant that
#-- compiles kpp at all, but it only does so bundled with the OpenAD
#-- adjoint packages, which require the real OpenAD source-transformation
