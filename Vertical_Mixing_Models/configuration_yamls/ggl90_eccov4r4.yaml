# GGL90 ECCOv4 Release 4 parameter overrides (like a user data.ggl90).
#
# Only the keys that differ from ggl90_default_parameters.yaml are listed; every
# other parameter keeps its default value when loaded via
# GGL90Parameters.from_yaml(this_file).
#
# Matches the GGL90 tuning used in the ECCO Version 4 Release 4 global 1-degree
# ocean state estimate:
#   alpha = 30.0        strong enhancement of TKE transport relative to
#                       viscosity. MITgcm computes tracer diffusivity from the
#                       turbulent Prandtl number, not directly from alpha.
#   tke_min = 1.0e-7    elevated background TKE floor.
#   tke_bottom = 1.0e-6 enhanced near-bottom mixing.
#   mxl_max_flag = 2    smooth two-way-sweep mixing length (Blanke & Delecluse).
#   mxl_surf_flag = true  enforce mixing between the first and second level.
#   use_smooth = true   OPA-style horizontal smoothing (no-op for a single column).

alpha: 30.0
tke_min: 1.0e-7
tke_bottom: 1.0e-6
mxl_max_flag: 2
mxl_surf_flag: true
use_smooth: true
