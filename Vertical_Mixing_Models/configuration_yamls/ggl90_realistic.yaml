# GGL90 "realistic" parameter overrides (like a user data.ggl90).
#
# Only the keys that differ from ggl90_default_parameters.yaml are listed; every
# other parameter keeps its default value when loaded via
# GGL90Parameters.from_yaml(this_file).
#
# A physically realistic set following the standard Gaspar et al. (1990)
# formulation, sitting between the bare defaults and the strongly-tuned ECCOv4
# R4 configuration. It differs from the defaults only in the mixing-length
# treatment (alpha=10.0 is already the built-in default, so it is not repeated
# here).
#
#   mxl_max_flag = 2    smooth two-way-sweep mixing length (Blanke & Delecluse).
#   mxl_surf_flag = true  enforce mixing between the first and second level.

mxl_max_flag: 2
mxl_surf_flag: true
